[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-audiobook-voice-forge"
version = "0.6.3"
description = "Multi-voice AI audiobook generator for Windows desktop. Turns EPUB/TXT/PDF into narrated M4B with per-character voice casting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "voiceforge contributors" }]
keywords = ["audiobook", "tts", "text-to-speech", "voice-cloning", "epub", "m4b"]

dependencies = [
    "numpy>=1.26,<3",
    "soundfile>=0.12.1",
    "sounddevice>=0.4.6",
    "pydub>=0.25.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
    "piper-tts>=1.2.0",
    "keyring>=25.0",
    "tomli-w>=1.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
xtts = ["TTS>=0.22.0", "torch>=2.3"]
kokoro = ["kokoro>=0.3.4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
voiceforge = "voiceforge.bootstrap:main"

[project.urls]
Homepage = "https://github.com/voiceforge/ai-audiobook-voice-forge"
Issues = "https://github.com/voiceforge/ai-audiobook-voice-forge/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=voiceforge --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["voiceforge"]